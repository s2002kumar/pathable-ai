[alembic]
script_location = migrations
prepend_sys_path = src

# Required from Alembic 1.16 onwards. Without it, Alembic falls back to legacy
# splitting of prepend_sys_path on spaces, commas *and colons* — which corrupts
# Windows paths like C:\... — and emits a DeprecationWarning that the test suite
# (filterwarnings = error) treats as a failure.
path_separator = os

# The URL is intentionally absent. migrations/env.py reads DATABASE_URL through the
# same validated Settings object the application uses, so there is exactly one
# connection string in the system and it never gets committed.

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Alembic's own logging is reconfigured by pathable_api.core.logging when env.py
# runs, so these sections only cover the standalone CLI before that happens.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
