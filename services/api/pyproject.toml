[project]
name = "pathable-api"
version = "0.1.0"
description = "PathAble AI backend — Phase 0 foundation (health, config, PostGIS baseline)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# No licence has been selected; see LICENSING.md at the repository root. This is
# a private, unreleased project and is not open source.
license = { text = "LicenseRef-Proprietary-Unreleased" }
dependencies = [
    "fastapi>=0.115.0,<0.200.0",
    "uvicorn[standard]>=0.34.0,<0.40.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.52,<3.0.0",
    "psycopg[binary,pool]>=3.2.3,<4.0.0",
    "alembic>=1.14.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/pathable-ai/pathable-ai"

[dependency-groups]
dev = [
    # >=9.0.3 for CVE-2025-71176 (PYSEC-2026-1845): pytest through 9.0.2 used a
    # predictable /tmp/pytest-of-{user} path on UNIX, allowing a local user to
    # cause a denial of service or possibly escalate. Found by pip-audit.
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    # Official successor to httpx: same author (Tom Christie), maintained by
    # Pydantic, and declared by Starlette 1.3's own `full` extra. Dev-scope only,
    # so it never reaches a container image or a production path.
    # Provenance verified in docs/development/DEPENDENCY_DECISIONS.md.
    "httpx2>=2.9.1,<3.0.0",
    "mypy>=1.14.0,<2.0.0",
    "ruff>=0.9.0,<0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pathable_api"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "ASYNC",
]
ignore = [
    # Line length is enforced by the formatter; the linter flagging it too just
    # produces noise on strings the formatter cannot split.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert`, and hard-coded local credentials are the point
# of the integration fixtures.
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["pathable_api"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# Alembic ships partial stubs; its generated env module is not worth strictening.
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# This module exists precisely to branch on the platform, and mypy only ever
# analyses one. On Linux it correctly reports the Windows branches as
# unreachable; on Windows it would say the same about the other side. The
# unreachable code is the point, so the check is disabled for this one module
# rather than globally.
module = ["pathable_api.core.event_loop"]
warn_unreachable = false

# ---------------------------------------------------------------------------
# pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: requires a live PostgreSQL/PostGIS database (set DATABASE_URL)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/pathable_api"]
branch = true
omit = [
    # Executed only by Alembic's own CLI against a live database; covered by the
    # integration migration test rather than by import-time coverage.
    "src/pathable_api/__main__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
