name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. No job here needs to write to the repository, and
# no job requires a secret — which is what makes this workflow safe to run on
# pull requests from forks.
permissions:
  contents: read

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Pinned so a Python patch release cannot silently change behaviour mid-sprint.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend-quality:
    name: Backend · format, lint, types
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Verify the lockfile matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type check
        run: uv run mypy src tests

  backend-unit-tests:
    name: Backend · unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - run: uv sync --frozen

      - name: Unit tests with coverage
        run: >
          uv run pytest tests/unit
          --cov=src/pathable_api
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=85

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-unit-coverage
          path: services/api/coverage.xml
          retention-days: 7

  backend-integration-tests:
    name: Backend · PostGIS integration tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api

    services:
      postgres:
        # Same pinned image as compose.yaml, so CI proves what developers run.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: pathable
          POSTGRES_PASSWORD: pathable_ci_only
          POSTGRES_DB: pathable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathable -d pathable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://pathable:pathable_ci_only@localhost:5432/pathable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - run: uv sync --frozen

      - name: Integration tests against real PostGIS
        run: uv run pytest tests/integration -v

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend-quality:
    name: Frontend · format, lint, types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm --filter @pathable/web lint

      - name: Type check
        run: pnpm -r --if-present typecheck

  frontend-unit-tests:
    name: Frontend · unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests with coverage
        run: pnpm --filter @pathable/web test:unit

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-coverage
          path: apps/web/coverage
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Contracts
  # ---------------------------------------------------------------------------
  contract-drift:
    name: Contracts · drift check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: services/api

      - name: Committed contracts must match the backend schemas
        run: pnpm contracts:check

  # ---------------------------------------------------------------------------
  # Builds and browser tests
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend · production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: Frontend · Playwright and accessibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @pathable/web exec playwright install --with-deps chromium

      # No database, no API and no tile server: the suite uses a local
      # source-less map style and stubs the backend at the network layer.
      - name: End-to-end and accessibility tests
        run: pnpm --filter @pathable/web test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts/screenshots
          retention-days: 7

  fullstack-e2e:
    name: Frontend · full-stack browser tests (no stubs)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: pathable
          POSTGRES_PASSWORD: pathable_ci_only
          POSTGRES_DB: pathable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathable -d pathable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://pathable:pathable_ci_only@localhost:5432/pathable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: services/api

      - name: Apply migrations to the service database
        run: uv run alembic upgrade head
        working-directory: services/api

      - name: Install Chromium
        run: pnpm --filter @pathable/web exec playwright install --with-deps chromium

      # Proves the frontend and backend actually agree. The default e2e suite
      # stubs the API at the network layer, which is deterministic but says
      # nothing about integration.
      - name: Full-stack browser tests
        run: pnpm --filter @pathable/web test:e2e:fullstack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-fullstack
          path: |
            apps/web/playwright-report-fullstack
            apps/web/test-results-fullstack
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Container images
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker · compose config and image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compose configuration is valid
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build the API image
        run: docker compose build api

      - name: Build the web image
        run: docker compose build web

      - name: No credentials baked into the API image
        run: |
          # The image must carry no .env file. Secrets arrive at run time only.
          if docker compose run --rm --no-deps --entrypoint sh api -c 'ls -a /app | grep -q "^\.env$"'; then
            echo "::error::A .env file was found inside the API image"
            exit 1
          fi
          echo "No .env present in the API image"
