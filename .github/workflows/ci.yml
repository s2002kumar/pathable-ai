name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. No job here needs to write to the repository, and
# no job requires a secret — which is what makes this workflow safe to run on
# pull requests from forks.
permissions:
  contents: read

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Pinned so a Python patch release cannot silently change behaviour mid-sprint.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend-quality:
    name: Backend · format, lint, types
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Verify the lockfile matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type check
        run: uv run mypy src tests

  backend-unit-tests:
    name: Backend · unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - run: uv sync --frozen

      # No coverage floor here. It moved to the integration job, which is the
      # only one that can run the whole suite — see the comment there.
      - name: Unit tests with coverage
        run: >
          uv run pytest tests/unit
          --cov=src/pathable_api
          --cov-report=term-missing
          --cov-report=xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-unit-coverage
          path: services/api/coverage.xml
          retention-days: 7

  backend-integration-tests:
    name: Backend · PostGIS integration tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api

    services:
      postgres:
        # Same pinned image as compose.yaml, so CI proves what developers run.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: pathable
          POSTGRES_PASSWORD: pathable_ci_only
          POSTGRES_DB: pathable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathable -d pathable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://pathable:pathable_ci_only@localhost:5432/pathable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - run: uv sync --frozen

      # The whole suite, not just tests/integration, and the coverage floor
      # lives here rather than on the unit job.
      #
      # Substantial behaviour — the dataset lifecycle, loading a graph out of
      # PostGIS, region seeding — is deliberately covered against a real database
      # rather than a mock, because that is the only way those guarantees are
      # worth anything. Enforcing the floor over unit tests alone therefore
      # measured the wrong thing: it counted real-PostGIS coverage as absent and
      # rewarded moving logic to where a unit test could reach it.
      #
      # The threshold is 86%, above the 85% it replaces and just under the 87.27%
      # this suite currently reaches, so it ratchets rather than slackens.
      - name: Whole suite against real PostGIS, with the coverage floor
        run: >
          uv run pytest -v
          --cov=src/pathable_api
          --cov-report=term-missing
          --cov-fail-under=86

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend-quality:
    name: Frontend · format, lint, types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm --filter @pathable/web lint

      - name: Type check
        run: pnpm -r --if-present typecheck

  frontend-unit-tests:
    name: Frontend · unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests with coverage
        run: pnpm --filter @pathable/web test:unit

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-coverage
          path: apps/web/coverage
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Contracts
  # ---------------------------------------------------------------------------
  contract-drift:
    name: Contracts · drift check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: services/api

      - name: Committed contracts must match the backend schemas
        run: pnpm contracts:check

  # ---------------------------------------------------------------------------
  # Builds and browser tests
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend · production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: Frontend · Playwright and accessibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @pathable/web exec playwright install --with-deps chromium

      # No database, no API and no tile server: the suite uses a local
      # source-less map style and stubs the backend at the network layer.
      - name: End-to-end and accessibility tests
        run: pnpm --filter @pathable/web test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/artifacts/screenshots
          retention-days: 7

  fullstack-e2e:
    name: Frontend · full-stack browser tests (no stubs)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: pathable
          POSTGRES_PASSWORD: pathable_ci_only
          POSTGRES_DB: pathable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathable -d pathable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://pathable:pathable_ci_only@localhost:5432/pathable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: services/api

      - name: Apply migrations to the service database
        run: uv run alembic upgrade head
        working-directory: services/api

      # Routing needs a network to route on. The synthetic fixture is used rather
      # than a real OSM import so this job stays deterministic and never depends
      # on a donated public service being reachable.
      - name: Load the synthetic network
        run: uv run pathable ingest synthetic
        working-directory: services/api

      # Real OpenStreetMap data, small and sealed in the repository: the
      # University of Waterloo campus, without elevation (provenance and ODbL
      # terms in services/api/tests/data/README.md). Loaded through the same
      # gated lifecycle an operator uses, with the acceptance it needs recorded,
      # and the place index built from the same file. This is what lets the
      # place-search and demo suites run here instead of skipping.
      - name: Load the campus extract and its place index
        working-directory: services/api
        run: |
          set -euo pipefail
          fixture=tests/data/uw-campus.osm.pbf
          uv run pathable regions seed
          uv run pathable ingest pbf --region waterloo --file "$fixture" \
            --provider overpass-api.de --source-timestamp 2026-11-07T02:48:06Z \
            --no-elevation-required | tee "$RUNNER_TEMP/ingest.txt"
          dataset="$(sed -n 's/^Dataset \([0-9a-f-]*\) .*/\1/p' "$RUNNER_TEMP/ingest.txt" | head -n 1)"
          uv run pathable datasets seal "$dataset"
          # Exit 3 is "review required", which a region's first dataset always
          # is: there is no live network to compare with. Anything else fails.
          status=0
          uv run pathable datasets evaluate "$dataset" > "$RUNNER_TEMP/evaluate.txt" || status=$?
          cat "$RUNNER_TEMP/evaluate.txt"
          if [ "$status" -ne 3 ]; then
            echo "::error::datasets evaluate exited $status, not 3 (review required)"
            exit 1
          fi
          run="$(sed -n 's/^Regression run \([0-9a-f-]*\).*/\1/p' "$RUNNER_TEMP/evaluate.txt" | head -n 1)"
          uv run pathable datasets accept "$run" --reason \
            "CI only: the sealed campus extract in services/api/tests/data is the region's first dataset, so there is nothing live to compare with, and most corpus journeys lie outside it."
          uv run pathable datasets activate "$dataset"
          uv run pathable gazetteer build --region waterloo --file "$fixture" \
            --provider overpass-api.de

      - name: Install Chromium
        run: pnpm --filter @pathable/web exec playwright install --with-deps chromium

      # Proves the frontend and backend actually agree. The default e2e suite
      # stubs the API at the network layer, which is deterministic but says
      # nothing about integration.
      - name: Full-stack browser tests
        run: pnpm --filter @pathable/web test:e2e:fullstack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-fullstack
          path: |
            apps/web/playwright-report-fullstack
            apps/web/test-results-fullstack
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Container images
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker · compose config and image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compose configuration is valid
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build the API image
        run: docker compose build api

      - name: Build the web image
        run: docker compose build web

      - name: No credentials baked into the API image
        run: |
          # The image must carry no .env file. Secrets arrive at run time only.
          if docker compose run --rm --no-deps --entrypoint sh api -c 'ls -a /app | grep -q "^\.env$"'; then
            echo "::error::A .env file was found inside the API image"
            exit 1
          fi
          echo "No .env present in the API image"

      - name: The operator CLI starts inside the API image
        run: |
          # Regression: a rebuilt base image dropped libexpat1, and `pathable`
          # failed with "ImportError: libexpat.so.1" while the server still
          # started, so nothing noticed until a deployment needed the CLI.
          docker compose run --rm --no-deps --entrypoint pathable api --help > /dev/null
          docker compose run --rm --no-deps --entrypoint python api -c "import osmium, pathable_api.cli"
          echo "pathable CLI imports cleanly in the API image"

      - name: VPS compose configuration is valid
        run: |
          POSTGRES_SUPERUSER_PASSWORD=ci PATHABLE_DB_PASSWORD=ci PATHABLE_REVISION=ci \
          PATHABLE_APP_VERSION=ci PATHABLE_HOST=pilot.example.invalid \
            docker compose -f infra/vps/compose.yaml config --quiet
          # And with the metrics agent the host runs once it has credentials.
          POSTGRES_SUPERUSER_PASSWORD=ci PATHABLE_DB_PASSWORD=ci PATHABLE_REVISION=ci \
          PATHABLE_APP_VERSION=ci PATHABLE_HOST=pilot.example.invalid \
            docker compose -f infra/vps/compose.yaml --profile observability config --quiet

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  observability-config:
    name: Observability · agent config and alert rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Alloy's own validator, from the same image the host runs. The values
      # are placeholders: nothing here connects anywhere.
      - name: Alloy configuration is valid
        run: |
          docker run --rm -v "$PWD/infra/vps/alloy:/etc/alloy:ro" \
            -e PATHABLE_HOST=pilot.example.invalid \
            -e GRAFANA_CLOUD_PROMETHEUS_URL=https://prometheus.example.invalid/api/prom/push \
            -e GRAFANA_CLOUD_PROMETHEUS_USER=0 \
            -e GRAFANA_CLOUD_PROMETHEUS_TOKEN=ci-placeholder \
            grafana/alloy:v1.21.2 validate /etc/alloy/config.alloy

      - name: Rendering refuses to guess the latency threshold
        run: |
          if sh infra/vps/grafana/render-alerts.sh > /dev/null 2>&1; then
            echo "::error::render-alerts.sh produced rules without ROUTE_P95_THRESHOLD_SECONDS"
            exit 1
          fi

      # The compose service itself, started as the host starts it, with
      # placeholder credentials. Validating the config file could not see that
      # Alloy, as root with every capability dropped, cannot reach its own
      # storage: it restarted forever on the pilot (2026-11-07). Nothing here
      # connects anywhere; the scrape and the remote write simply fail.
      - name: The Alloy service starts as compose defines it
        run: |
          set -euo pipefail
          mkdir -p infra/secrets
          printf '%s\n' \
            GRAFANA_CLOUD_PROMETHEUS_URL=https://prometheus.example.invalid/api/prom/push \
            GRAFANA_CLOUD_PROMETHEUS_USER=0 \
            GRAFANA_CLOUD_PROMETHEUS_TOKEN=ci-placeholder > infra/secrets/grafana-cloud.env
          export POSTGRES_SUPERUSER_PASSWORD=ci PATHABLE_DB_PASSWORD=ci PATHABLE_REVISION=ci \
            PATHABLE_APP_VERSION=ci PATHABLE_HOST=pilot.example.invalid
          docker compose -f infra/vps/compose.yaml --profile observability up -d --no-deps alloy
          sleep 15
          docker logs pathable-alloy-1 2>&1 | tail -n 15
          state="$(docker inspect --format '{{.State.Status}} restarts={{.RestartCount}}' pathable-alloy-1)"
          docker compose -f infra/vps/compose.yaml --profile observability down -v
          if [ "$state" != "running restarts=0" ]; then
            echo "::error::the Alloy service is $state, not running"
            exit 1
          fi

      # 0.5 s is the test suite's value, not a production threshold; see the
      # header of alerts.test.yaml.
      - name: Alert rules are valid and behave as tested
        run: |
          mkdir -p "$RUNNER_TEMP/alerts"
          ROUTE_P95_THRESHOLD_SECONDS=0.5 sh infra/vps/grafana/render-alerts.sh \
            > "$RUNNER_TEMP/alerts/latency.rules.yaml"
          cp infra/vps/grafana/availability.rules.yaml infra/vps/grafana/alerts.test.yaml \
            "$RUNNER_TEMP/alerts/"
          docker run --rm -v "$RUNNER_TEMP/alerts:/alerts:ro" -w /alerts \
            --entrypoint promtool prom/prometheus:v3.15.1 check rules \
            availability.rules.yaml latency.rules.yaml
          docker run --rm -v "$RUNNER_TEMP/alerts:/alerts:ro" -w /alerts \
            --entrypoint promtool prom/prometheus:v3.15.1 test rules alerts.test.yaml
