packages:
  - "apps/*"
  - "packages/*"

# Postinstall scripts are blocked by default; each one is an arbitrary-code-
# execution point at install time. Only packages listed here may run them, and
# every entry needs a reason.
# Transitive dependency overrides.
#
# GHSA-5p4m-2wfm-xmqj (CVE-2026-59870): js-yaml < 4.3.1 has quadratic CPU
# consumption resolving `!!omap`. It reaches us only through
# openapi-typescript -> @redocly/openapi-core -> js-yaml, and
# openapi-typescript is already on its latest release, so there is no version
# bump that clears it. 4.3.1 is a patch release over the 4.3.0 we resolved,
# and the contract drift check proves the generated output is unchanged.
#
# Remove this once @redocly/openapi-core ships a release depending on >= 4.3.1.
# GHSA-2v37-7h3g-55p8: nanoid < 3.3.18 loops indefinitely when a custom
# generator is given size zero. It reaches us only through postcss, under both
# Next and Vite, so there is no direct dependency to bump.
#
# Remove this once postcss depends on >= 3.3.18.
overrides:
  "js-yaml@>=4.0.0 <4.3.1": "^4.3.1"
  "nanoid@<3.3.18": ">=3.3.18"

allowBuilds:
  # Native module resolver used by eslint-plugin-import-x (via eslint-config-next).
  # Without its build step, `pnpm lint` fails to resolve any import.
  unrs-resolver: true
