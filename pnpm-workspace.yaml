packages:
  - "apps/*"
  - "packages/*"

# Postinstall scripts are blocked by default; each one is an arbitrary-code-
# execution point at install time. Only packages listed here may run them, and
# every entry needs a reason.
# Transitive dependency overrides.
#
# GHSA-5p4m-2wfm-xmqj (CVE-2026-59870): js-yaml < 4.3.1 has quadratic CPU
# consumption resolving `!!omap`. It reaches us only through
# openapi-typescript -> @redocly/openapi-core -> js-yaml, and
# openapi-typescript is already on its latest release, so there is no version
# bump that clears it. 4.3.1 is a patch release over the 4.3.0 we resolved,
# and the contract drift check proves the generated output is unchanged.
#
# Remove this once @redocly/openapi-core ships a release depending on >= 4.3.1.
# GHSA-2v37-7h3g-55p8: nanoid < 3.3.18 loops indefinitely when a custom
# generator is given size zero. It reaches us only through postcss, under both
# Next and Vite, so there is no direct dependency to bump.
#
# Remove this once postcss depends on >= 3.3.18.
# GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3, GHSA-vp8m-p9jh-q5pm: undici < 8.10.2.
# It reaches us only through jsdom, the unit tests' DOM, so it is dev only.
#
# Remove this once jsdom depends on >= 8.10.2.
# GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p: brace-expansion, through minimatch
# under ESLint, eslint-config-next and openapi-typescript. Dev only. Each major
# line is lifted to its own first patched release.
#
# Remove these once minimatch's dependants ship the patched releases.
# GHSA-68fv-2mgg-jv7q: source-map-js < 1.2.2 can stall the event loop on a
# crafted source map. It reaches us only through postcss under Next, at build
# time; 1.2.2 is a patch release over the 1.2.1 we resolved.
#
# Remove this once postcss depends on >= 1.2.2.
overrides:
  "js-yaml@>=4.0.0 <4.3.1": "^4.3.1"
  "nanoid@<3.3.18": ">=3.3.18"
  "undici@>=8.0.0 <8.10.2": "^8.10.2"
  "brace-expansion@<1.1.20": "^1.1.20"
  "brace-expansion@>=2.0.0 <2.1.6": "^2.1.6"
  "brace-expansion@>=4.0.0 <5.0.11": "^5.0.11"
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"

# Accepted advisories. Each entry is one GHSA id, never a class of advisories:
# `pnpm audit` still fails on anything else, unfixable or not.
#
# GHSA-vfj7-8cjw-p6xm (high): braces <= 3.0.3. Accepted 2026-10-06 by the
# founder. There is no patched release to move to: the advisory names 3.0.4,
# but npm's latest braces is 3.0.3 and GitHub's advisory lists no patched
# version. It reaches us only through a devDependency used for lint, as
# eslint-config-next -> @next/eslint-plugin-next -> fast-glob -> micromatch ->
# braces, so it runs only when ESLint runs over our own source tree. Nothing
# in the production build or runtime loads it.
#
# Remove this entry as soon as a patched braces can be installed: a release
# >= 3.0.4 on npm, or an @next/eslint-plugin-next that no longer depends on it.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  # Native module resolver used by eslint-plugin-import-x (via eslint-config-next).
  # Without its build step, `pnpm lint` fails to resolve any import.
  unrs-resolver: true
